name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Locate and Build Pico W Firmware
        run: |
          # 1. 暴力搜尋 micropython.cmake 的真實路徑
          echo "🔍 正在搜尋 micropython.cmake..."
          CMAKE_PATH=$(find ${{ github.workspace }}/bluepad32 -name "micropython.cmake" | head -n 1)
          
          if [ -z "$CMAKE_PATH" ]; then
            echo "❌ 錯誤：在整個 bluepad32 倉庫中都找不到 micropython.cmake！"
            echo "目前 bluepad32 目錄結構如下："
            ls -R ${{ github.workspace }}/bluepad32
            exit 1
          fi

          # 取得該檔案所在的資料夾路徑
          BP32_MOD_DIR=$(dirname "$CMAKE_PATH")
          echo "✅ 成功鎖定模組目錄：$BP32_MOD_DIR"

          # 2. 進入編譯目錄
          cd micropython/ports/rp2
          
          # 3. 執行編譯
          # 注意：USER_C_MODULES 需要指向該目錄
          make BOARD=RPI_PICO_W USER_C_MODULES="$BP32_MOD_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
