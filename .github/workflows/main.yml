name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Build Pico W Firmware
        run: |
          # 1. 取得絕對路徑
          BP32_DIR="${{ github.workspace }}/bluepad32/src/main/api/micropython"
          echo "🎯 Bluepad32 Module Directory: $BP32_DIR"
          
          # 2. 驗證該目錄下是否有必要的編譯文件
          if [ ! -f "$BP32_DIR/micropython.cmake" ]; then
            echo "❌ Error: micropython.cmake not found in $BP32_DIR"
            exit 1
          fi

          cd micropython/ports/rp2
          
          # 3. 核心修正：使用 cmake 指令明確注入模組，然後再進行 make
          # 這是確保 C 模組被正確連結的最穩健方法
          export USER_C_MODULES=$BP32_DIR
          
          # 先清理舊的 build，確保全新編譯
          rm -rf build-RPI_PICO_W
          
          # 執行編譯
          make BOARD=RPI_PICO_W USER_C_MODULES=$USER_C_MODULES

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
