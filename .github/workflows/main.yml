name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32

      - name: Find C Module Path
        id: find_path
        run: |
          echo "🔍 正在全盤掃描 micropython.cmake..."
          # 尋找所有包含 micropython.cmake 的路徑
          SEARCH_RESULT=$(find ${{ github.workspace }}/bluepad32 -name "micropython.cmake")
          
          if [ -z "$SEARCH_RESULT" ]; then
            echo "❌ 找不到 micropython.cmake！列出 bluepad32 目錄下的一級子目錄："
            ls -F ${{ github.workspace }}/bluepad32
            echo "--- 深度目錄掃描 ---"
            find ${{ github.workspace }}/bluepad32 -maxdepth 3 -type d
            exit 1
          fi
          
          # 取第一個找到的路徑，並轉換為目錄路徑
          FINAL_DIR=$(dirname "$SEARCH_RESULT")
          echo "✅ 找到路徑：$FINAL_DIR"
          echo "module_dir=$FINAL_DIR" >> $GITHUB_OUTPUT

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Build Pico W Firmware
        run: |
          BP32_MOD_DIR="${{ steps.find_path.outputs.module_dir }}"
          cd micropython/ports/rp2
          
          # 正式執行編譯
          make BOARD=RPI_PICO_W USER_C_MODULES="$BP32_MOD_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
