name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32 MicroPython Module
        uses: actions/checkout@v4
        with:
          # 注意：這是正確的專案倉庫，包含 C 模組接口
          repository: ricardoquesada/bluepad32-micropython
          path: bluepad32-mpy

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Build Pico W Firmware
        run: |
          # 1. 搜尋正確的模組路徑
          CMAKE_PATH=$(find ${{ github.workspace }}/bluepad32-mpy -name "micropython.cmake" | head -n 1)
          BP32_MOD_DIR=$(dirname "$CMAKE_PATH")
          
          echo "✅ 成功找到模組目錄：$BP32_MOD_DIR"

          # 2. 進入編譯目錄
          cd micropython/ports/rp2
          
          # 3. 執行編譯
          # 這裡我們加上 V=1 來觀察是否有 "Including User C Module" 字樣
          make BOARD=RPI_PICO_W USER_C_MODULES="$BP32_MOD_DIR" V=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
