name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          # 我們回歸主專案，它是存在的
          path: bluepad32

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Build Pico W Firmware
        run: |
          # 1. 這次我們直接指定 Bluepad32 裡面的 MicroPython 接口目錄
          # 這是 Bluepad32 專案中負責對接 MicroPython 的 C 程式碼位置
          BP32_MOD_DIR="${{ github.workspace }}/bluepad32/src/main/api/micropython"
          
          echo "✅ 正在嘗試連結模組目錄：$BP32_MOD_DIR"
          
          # 檢查目錄內容，確保我們沒找錯 (這步很重要，失敗會在這裡看到結構)
          ls -F $BP32_MOD_DIR

          cd micropython/ports/rp2
          
          # 2. 執行編譯
          # 注意：USER_C_MODULES 必須指向包含 micropython.cmake 的目錄
          make BOARD=RPI_PICO_W USER_C_MODULES="$BP32_MOD_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
