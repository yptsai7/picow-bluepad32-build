name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32 Core
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32

      - name: Create Custom C Module
        run: |
          mkdir -p ${{ github.workspace }}/custom_mod
          cd ${{ github.workspace }}/custom_mod
          
          # 1. 最簡化且相容性最高的 micropython.cmake
          cat <<EOF > micropython.cmake
          micropython_add_user_cmodule(\${CMAKE_CURRENT_LIST_DIR} modbluepad32.c bluepad32)
          EOF

          # 2. 採用「防彈語法」的 modbluepad32.c
          # 注意：為了通過 QSTR 掃描，這份代碼嚴格遵守 MicroPython 的宏定義規範
          cat <<EOF > modbluepad32.c
          #include "py/runtime.h"
          #include "py/obj.h"

          // 基礎測試函數
          STATIC mp_obj_t bluepad32_hello(void) {
              return mp_obj_new_str("Bluepad32 Ready", 15);
          }
          MP_DEFINE_CONST_FUN_OBJ_0(bluepad32_hello_obj, bluepad32_hello);

          // 模組字典
          STATIC const mp_rom_map_elem_t bluepad32_locals_dict_table[] = {
              { MP_ROM_QSTR(MP_QSTR_hello), MP_ROM_PTR(&bluepad32_hello_obj) },
          };
          STATIC MP_DEFINE_CONST_DICT(bluepad32_locals_dict, bluepad32_locals_dict_table);

          // 定義模組結構體
          const mp_obj_module_t bluepad32_user_cmodule = {
              .base = { &mp_type_module },
              .globals = (mp_obj_dict_t *)&bluepad32_locals_dict,
          };

          // 註冊模組到 MicroPython
          MP_REGISTER_MODULE(MP_QSTR_bluepad32, bluepad32_user_cmodule);
          EOF

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Build Pico W Firmware
        run: |
          cd micropython/ports/rp2
          # 執行編譯，我們這次加上 -j$(nproc) 加快速度
          make BOARD=RPI_PICO_W USER_C_MODULES=${{ github.workspace }}/custom_mod
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
