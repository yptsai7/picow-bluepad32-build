name: Build MicroPython Bluepad32 for Pico W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi build-essential python3 libnewlib-arm-none-eabi cmake

      - name: Checkout MicroPython
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          path: micropython

      - name: Checkout Bluepad32 MicroPython Module
        uses: actions/checkout@v4
        with:
          # 關鍵：這是 2026 年存放 MicroPython C 模組的正確倉庫
          repository: ricardoquesada/bluepad32-py
          path: bluepad32-py

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross

      - name: Build Pico W Firmware
        run: |
          # 1. 搜尋並確認模組路徑
          CMAKE_PATH=$(find ${{ github.workspace }}/bluepad32-py -name "micropython.cmake" | head -n 1)
          
          if [ -z "$CMAKE_PATH" ]; then
            echo "❌ 依然找不到 micropython.cmake！列出下載內容："
            ls -R ${{ github.workspace }}/bluepad32-py
            exit 1
          fi
          
          BP32_MOD_DIR=$(dirname "$CMAKE_PATH")
          echo "✅ 成功鎖定模組目錄：$BP32_MOD_DIR"

          # 2. 進入編譯目錄並連結
          cd micropython/ports/rp2
          make BOARD=RPI_PICO_W USER_C_MODULES="$BP32_MOD_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-bluepad32-picow
          path: micropython/ports/rp2/build-RPI_PICO_W/firmware.uf2
